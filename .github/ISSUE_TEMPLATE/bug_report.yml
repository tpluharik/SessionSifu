name: Bug report
description: Report a reproducible SessionSifu problem or regression
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SessionSifu. Search existing issues first and remove private window titles, usernames and document paths from logs or screenshots.
  - type: input
    id: sessionsifu-version
    attributes:
      label: SessionSifu version
      description: Open SessionSifu or check the installed package version.
      placeholder: "1.3.1"
    validations:
      required: true
  - type: input
    id: ubuntu-version
    attributes:
      label: Ubuntu version
      placeholder: "26.04"
    validations:
      required: true
  - type: input
    id: gnome-version
    attributes:
      label: GNOME Shell version
      description: Run `gnome-shell --version` if needed.
      placeholder: "GNOME Shell 50.x"
    validations:
      required: true
  - type: dropdown
    id: session-type
    attributes:
      label: Display session
      options:
        - Wayland
        - X11
        - Unknown
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - Debian package from this repository
        - SessionSifu in-app updater
        - Built from source
        - Other
    validations:
      required: true
  - type: dropdown
    id: extension-state
    attributes:
      label: GNOME extension state
      options:
        - Enabled and top-bar icon visible
        - Enabled but top-bar icon missing
        - Installed but disabled
        - Extension not found
        - Unknown
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Open ...
        2. Save ...
        3. Restore ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste only the relevant excerpt and remove private paths, titles, tokens and usernames.
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed private information from this report and its attachments.
          required: true
