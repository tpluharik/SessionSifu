name: Build and release SessionSifu

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-tests:
    name: Portable tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install portable core
        run: python -m pip install ./portable
      - name: Install Linux OCR test runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - name: Run portable tests
        run: python tests/test_portable.py
      - name: Run encrypted Recall engine tests
        if: runner.os == 'Linux'
        run: python tests/test_recall_engine.py
      - name: Compile portable sources
        run: python -m compileall -q portable/sessionsifu_portable packaging/build-portable.py

  portable-bundles:
    name: Build ${{ matrix.artifact }}
    needs: portable-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos
            arch: arm64
            artifact: SessionSifu-macOS-arm64
          - os: macos-15-intel
            target: macos
            arch: x64
            artifact: SessionSifu-macOS-x64
          - os: ubuntu-26.04
            target: linux
            arch: x64
            artifact: SessionSifu-Linux-portable-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install bundle dependencies
        run: python -m pip install "./portable[gui,build]"
      - name: Build desktop bundle
        run: python packaging/build-portable.py --target ${{ matrix.target }} --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/portable/*
          if-no-files-found: error

  windows-bundle:
    name: Build and sign Windows x64
    needs: portable-tests
    runs-on: windows-2025
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install bundle dependencies
        run: python -m pip install "./portable[gui,build]"
      - name: Build Windows bundle
        run: python packaging/build-portable.py --target windows --arch x64
      - name: Sign Windows executable
        id: sign_windows
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePresent = `
            -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64) -and `
            -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          if (-not $certificatePresent) {
            "signed=false" >> $env:GITHUB_OUTPUT
            Write-Warning 'Windows bundle is unsigned and will be retained only as a development artifact; tagged releases withhold it.'
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'sessionsifu-authenticode.pfx'
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64)
            )
            $signTool = Get-ChildItem `
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signTool) { throw 'signtool.exe was not found on the Windows runner.' }

            $executable = 'build\pyinstaller-windows-x64\dist\SessionSifu\SessionSifu.exe'
            & $signTool.FullName sign /fd SHA256 /td SHA256 `
              /tr http://timestamp.digicert.com `
              /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD $executable
            if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed.' }

            $signature = Get-AuthenticodeSignature $executable
            if ($signature.Status -ne 'Valid') {
              throw "Authenticode verification failed: $($signature.Status)"
            }
            "signed=true" >> $env:GITHUB_OUTPUT

            $version = (Select-String `
              -Path 'portable\sessionsifu_portable\__init__.py' `
              -Pattern '^VERSION = "([^"]+)"$').Matches[0].Groups[1].Value
            if ([string]::IsNullOrWhiteSpace($version)) {
              throw 'Could not read the portable SessionSifu version.'
            }
            $archive = "dist\portable\SessionSifu-$version-windows-x64.zip"
            Remove-Item $archive -Force
            Compress-Archive `
              -Path 'build\pyinstaller-windows-x64\dist\SessionSifu' `
              -DestinationPath $archive -CompressionLevel Optimal
          }
          finally {
            if (Test-Path $certificatePath) {
              Remove-Item $certificatePath -Force
            }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref_type != 'tag' || steps.sign_windows.outputs.signed == 'true'
        with:
          name: SessionSifu-Windows-x64
          path: dist/portable/*
          if-no-files-found: error

  gnome-package:
    name: Build GNOME Debian package
    needs: portable-tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install GNOME build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils dpkg-dev gjs gir1.2-adw-1 gir1.2-gdkpixbuf-2.0 gir1.2-gtk-4.0 gir1.2-gtop-2.0 gnome-shell libglib2.0-bin nodejs python3-cryptography python3-gi python3-keyring python3-pil tesseract-ocr zip
      - name: Build and validate Debian package
        run: ./packaging/build-deb.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SessionSifu-GNOME-Debian
          path: dist/sessionsifu_*_all.deb
          if-no-files-found: error

  ubuntu24-package-compatibility:
    name: Validate Debian package on Ubuntu 24.04 / GNOME 46 generation
    needs: portable-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install package build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils dpkg-dev gjs gnome-settings-daemon-common gnome-shell gir1.2-adw-1 gir1.2-gdkpixbuf-2.0 gir1.2-gtk-4.0 gir1.2-gtop-2.0 libglib2.0-bin nodejs python3-cryptography python3-gi python3-keyring python3-pil python3-pyatspi tesseract-ocr zip
      - name: Build and verify Ubuntu 24.04-compatible dependency metadata
        run: |
          ./packaging/build-deb.sh
          test "$(dpkg-deb -f dist/sessionsifu_3.5.8_all.deb Version)" = "3.5.8"
          ! dpkg-deb -f dist/sessionsifu_3.5.8_all.deb Depends | grep -q gnome-shell
          dpkg-deb -f dist/sessionsifu_3.5.8_all.deb Recommends | grep -q gnome-shell
          test "$(python3 -c 'import json; print(json.load(open("extension/sessionsifu@local/metadata.json"))["shell-version"][0])')" = "50"

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [portable-bundles, windows-bundle, gnome-package, ubuntu24-package-compatibility]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Generate package-manager submissions
        run: |
          python3 packaging/generate-marketplace-metadata.py \
            --asset-dir release-artifacts \
            --output marketplace-metadata
          tar -C marketplace-metadata -czf \
            "release-artifacts/SessionSifu-${GITHUB_REF_NAME#v}-marketplace-metadata.tar.gz" .
      - name: Generate checksums
        run: sha256sum release-artifacts/* > release-artifacts/SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-artifacts/* --generate-notes --verify-tag

  chocolatey:
    name: Publish Chocolatey package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: windows-2025
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Check for a signed Windows release asset
        id: windows_asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = gh release view $env:GITHUB_REF_NAME --json assets --jq '.assets[].name'
          $available = [bool]($assets | Where-Object { $_ -like 'SessionSifu-*-windows-x64.zip' })
          "available=$($available.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $available) {
            Write-Warning 'Chocolatey publication is withheld because this release has no signed Windows asset.'
          }
      - name: Download immutable release assets
        if: steps.windows_asset.outputs.available == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          gh release download $env:GITHUB_REF_NAME `
            --pattern 'SessionSifu-*-windows-x64.zip' `
            --pattern 'SessionSifu-*-macos-arm64.zip' `
            --pattern 'SessionSifu-*-macos-x64.zip' `
            --pattern 'SessionSifu-*-linux-x64.tar.gz' `
            --dir release-assets
      - name: Generate and pack Chocolatey submission
        if: steps.windows_asset.outputs.available == 'true'
        shell: pwsh
        run: |
          python packaging/generate-marketplace-metadata.py `
            --asset-dir release-assets --output marketplace-metadata
          choco pack marketplace-metadata\chocolatey\sessionsifu\sessionsifu.nuspec `
            --output-directory chocolatey-packages
      - name: Publish to Chocolatey Community Repository
        if: steps.windows_asset.outputs.available == 'true'
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CHOCOLATEY_API_KEY)) {
            throw 'CHOCOLATEY_API_KEY is not configured in the release environment.'
          }
          $package = Get-ChildItem chocolatey-packages\sessionsifu.*.nupkg |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $package) { throw 'Chocolatey package was not created.' }
          choco push $package.FullName `
            --source https://push.chocolatey.org/ `
            --api-key $env:CHOCOLATEY_API_KEY
