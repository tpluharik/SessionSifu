name: Build and release SessionSifu

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-tests:
    name: Portable tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install portable core
        run: |
          python -m pip install --require-hashes -r packaging/requirements.lock
          python -m pip install --no-deps --no-build-isolation ./portable
      - name: Install Linux OCR test runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - name: Run portable tests
        run: python tests/test_portable.py
      - name: Run signed metadata regressions
        run: python tests/test_update_trust.py
      - name: Run audit fault-injection tests
        run: python tests/test_audit_regressions.py
      - name: Run offscreen Qt worker and capture tests
        run: python tests/test_qt_background.py
      - name: Run encrypted Recall engine tests
        if: runner.os == 'Linux'
        run: python tests/test_recall_engine.py
      - name: Compile portable sources
        run: python -m compileall -q portable/sessionsifu_portable packaging/build-portable.py
      - name: Smoke-test synthetic continuity benchmark
        if: runner.os == 'Linux'
        run: python tools/benchmark-work-continuity.py --windows 30 --iterations 5 --json

  portable-bundles:
    name: Build ${{ matrix.artifact }}
    needs: portable-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos
            arch: arm64
            artifact: SessionSifu-macOS-arm64
          - os: macos-15-intel
            target: macos
            arch: x64
            artifact: SessionSifu-macOS-x64
          - os: ubuntu-26.04
            target: linux
            arch: x64
            artifact: SessionSifu-Linux-portable-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install bundle dependencies
        run: |
          python -m pip install --require-hashes -r packaging/requirements.lock
          python -m pip install --no-deps --no-build-isolation ./portable
      - name: Build desktop bundle
        run: python packaging/build-portable.py --target ${{ matrix.target }} --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/portable/*
          if-no-files-found: error

  windows-bundle:
    name: Build unsigned Windows x64
    needs: portable-tests
    runs-on: windows-2025
    outputs:
      artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install bundle dependencies
        run: |
          python -m pip install --require-hashes -r packaging/requirements.lock
          python -m pip install --no-deps --no-build-isolation ./portable
      - name: Build Windows bundle
        run: python packaging/build-portable.py --target windows --arch x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: unsigned
        with:
          name: Unsigned-SessionSifu-Windows-x64
          path: build/pyinstaller-windows-x64/dist/SessionSifu/**
          if-no-files-found: error

  windows-sign:
    name: Sign Windows in isolated service job
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-bundle
    runs-on: windows-2025
    environment: release
    steps:
      # Deliberately no checkout, pip, PyInstaller, project code or PFX fallback.
      - name: Submit exact workflow artifact to SignPath
        id: sign
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.windows-bundle.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Verify signed artifact without executing it
        if: steps.sign.conclusion == 'success'
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem signed -Recurse -Filter SessionSifu.exe)
          if ($executables.Count -ne 1) { throw 'Expected exactly one signed executable.' }
          if ((Get-AuthenticodeSignature $executables[0].FullName).Status -ne 'Valid') { throw 'Authenticode verification failed.' }
          $version = $env:GITHUB_REF_NAME.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version.' }
          New-Item -ItemType Directory -Force release-content/SessionSifu, release-assets | Out-Null
          Copy-Item -Recurse signed/* release-content/SessionSifu/
          Compress-Archive -Path release-content/SessionSifu -DestinationPath "release-assets/SessionSifu-$version-windows-x64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.sign.conclusion == 'success'
        with:
          name: SessionSifu-Windows-x64
          path: release-assets/*
          if-no-files-found: error
      - name: Explain withheld Windows publication
        if: vars.SIGNPATH_ORGANIZATION_ID == ''
        shell: pwsh
        run: Write-Warning 'SignPath is not provisioned. Windows and Chocolatey publication remain withheld; no signing key is exported to a runner.'

  gnome-package:
    name: Build GNOME Debian package
    needs: portable-tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install GNOME build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils dpkg-dev gjs gir1.2-adw-1 gir1.2-gdkpixbuf-2.0 gir1.2-gtk-4.0 gir1.2-gtop-2.0 gnome-shell libglib2.0-bin nodejs python3-cryptography python3-gi python3-keyring python3-pil python3-yaml tesseract-ocr zip
      - name: Build and validate Debian package
        run: ./packaging/build-deb.sh
      - name: Archive expired legacy update bytes without rewriting history
        run: python3 packaging/archive-retired-updates.py --output "dist/SessionSifu-${GITHUB_REF_NAME#v}-legacy-user-updates.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SessionSifu-GNOME-Debian
          path: |
            dist/sessionsifu_*_all.deb
            dist/*GNOME-Debian.spdx.json
            dist/*legacy-user-updates.tar.gz
          if-no-files-found: error

  ubuntu24-package-compatibility:
    name: Validate Debian package on Ubuntu 24.04 / GNOME 46 generation
    needs: portable-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install package build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils dpkg-dev gjs gnome-settings-daemon-common gnome-shell gir1.2-adw-1 gir1.2-gdkpixbuf-2.0 gir1.2-gtk-4.0 gir1.2-gtop-2.0 libglib2.0-bin nodejs python3-cryptography python3-gi python3-keyring python3-pil python3-pyatspi python3-yaml tesseract-ocr zip
      - name: Build and verify Ubuntu 24.04-compatible dependency metadata
        run: |
          ./packaging/build-deb.sh
          version="$(python3 -c 'from portable.sessionsifu_portable import VERSION; print(VERSION)')"
          package="dist/sessionsifu_${version}_all.deb"
          test -f "$package"
          test "$(dpkg-deb -f "$package" Version)" = "$version"
          ! dpkg-deb -f "$package" Depends | grep -q gnome-shell
          dpkg-deb -f "$package" Recommends | grep -q gnome-shell
          test "$(python3 -c 'import json; print(json.load(open("extension/sessionsifu@local/metadata.json"))["shell-version"][0])')" = "50"

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [portable-bundles, windows-sign, gnome-package, ubuntu24-package-compatibility]
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: release-artifacts
          pattern: SessionSifu-*
          merge-multiple: true
      - name: Generate package-manager submissions
        run: |
          python3 packaging/generate-marketplace-metadata.py \
            --asset-dir release-artifacts \
            --output marketplace-metadata
          tar -C marketplace-metadata -czf \
            "release-artifacts/SessionSifu-${GITHUB_REF_NAME#v}-marketplace-metadata.tar.gz" .
      - name: Generate checksums
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          python3 packaging/generate-release-evidence.py \
            --artifact-dir release-artifacts \
            --output-dir release-artifacts \
            --commit "$GITHUB_SHA"
          (cd release-artifacts && sha256sum * > SHA256SUMS)
      - name: Attest exact release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-artifacts/*
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-artifacts/* --generate-notes --verify-tag

  chocolatey:
    name: Publish Chocolatey package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: windows-2025
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Check for a signed Windows release asset
        id: windows_asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = gh release view $env:GITHUB_REF_NAME --json assets --jq '.assets[].name'
          $available = [bool]($assets | Where-Object { $_ -like 'SessionSifu-*-windows-x64.zip' })
          "available=$($available.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $available) {
            Write-Warning 'Chocolatey publication is withheld because this release has no signed Windows asset.'
          }
      - name: Download immutable release assets
        if: steps.windows_asset.outputs.available == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          gh release download $env:GITHUB_REF_NAME `
            --pattern 'SessionSifu-*-windows-x64.zip' `
            --pattern 'SessionSifu-*-macos-arm64.zip' `
            --pattern 'SessionSifu-*-macos-x64.zip' `
            --pattern 'SessionSifu-*-linux-x64.tar.gz' `
            --dir release-assets
      - name: Generate and pack Chocolatey submission
        if: steps.windows_asset.outputs.available == 'true'
        shell: pwsh
        run: |
          python packaging/generate-marketplace-metadata.py `
            --asset-dir release-assets --output marketplace-metadata
          choco pack marketplace-metadata\chocolatey\sessionsifu\sessionsifu.nuspec `
            --output-directory chocolatey-packages
      - name: Publish to Chocolatey Community Repository
        if: steps.windows_asset.outputs.available == 'true'
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CHOCOLATEY_API_KEY)) {
            throw 'CHOCOLATEY_API_KEY is not configured in the release environment.'
          }
          $package = Get-ChildItem chocolatey-packages\sessionsifu.*.nupkg |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $package) { throw 'Chocolatey package was not created.' }
          choco push $package.FullName `
            --source https://push.chocolatey.org/ `
            --api-key $env:CHOCOLATEY_API_KEY
