name: sessionsifu
title: SessionSifu
base: core24
version: "3.5.35"
summary: Restore desktop applications, files and window layouts
description: |
  SessionSifu saves desktop sessions and restores applications, documents,
  workspaces and window geometry. Its optional Privacy Recall feature provides
  an encrypted, local-only visual timeline with application exclusions, local
  OCR and bounded retention. This snap contains the portable KDE Plasma and
  general GNOME edition; Ubuntu 26.04 users can use the PPA for full GNOME Shell
  50 integration.
  This is a classic-confinement snap: it is not sandboxed and has the desktop
  access of a normal application running as your user.
grade: stable
confinement: classic
license: GPL-3.0-or-later
icon: branding/sessionsifu-app-icon.png
website: https://github.com/tpluharik/SessionSifu
source-code: https://github.com/tpluharik/SessionSifu
issues: https://github.com/tpluharik/SessionSifu/issues
donation: https://github.com/sponsors/tpluharik

apps:
  sessionsifu:
    command: bin/sessionsifu-portable
    common-id: org.gnome.SessionSifu
    desktop: usr/share/applications/sessionsifu.desktop
    environment:
      PYTHONPATH: $SNAP/lib/python3.12/site-packages:$SNAP/usr/lib/python3/dist-packages
      TESSDATA_PREFIX: $SNAP/usr/share/tesseract-ocr/5/tessdata

parts:
  sessionsifu:
    plugin: python
    source: portable
    override-pull: |
      craftctl default
      cp "$CRAFT_PROJECT_DIR/packaging/runtime-requirements.lock" "$CRAFT_PART_SRC/requirements-release.lock"
    python-requirements:
      - requirements-release.lock
    stage-packages:
      # Classic snaps cannot use the interpreter from the core24 base. Bundle
      # Python explicitly so the launcher and virtual environment are portable.
      - libpython3.12-minimal
      - libpython3.12-stdlib
      - python3-minimal
      - python3.12-minimal
      - python3.12-venv
      - python3-pyatspi
      - libdbus-1-3
      - libegl1
      - libgl1
      - libxkbcommon0
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-xfixes0
      - libxcb-xinerama0
      - tesseract-ocr
      - tesseract-ocr-ces
      - tesseract-ocr-eng
      - wmctrl

  desktop:
    plugin: dump
    source: snap/gui
    organize:
      sessionsifu.desktop: usr/share/applications/sessionsifu.desktop
