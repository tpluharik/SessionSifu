<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!--
    Keep this symbolic asset to plain filled paths. GNOME Shell recolours
    symbolic icons and some Shell/librsvg combinations flatten SVG masks into
    a solid disc. The open silhouette remains recognisable even if the
    even-odd eye is not honoured by an older renderer.
  -->
  <path fill="#2e3436" fill-rule="evenodd" clip-rule="evenodd"
        d="M8 1a7 7 0 0 1 0 14 3.5 3.5 0 0 0 0-7 3.5 3.5 0 0 1 0-7Zm0 2.1a1.15 1.15 0 1 0 0 2.3 1.15 1.15 0 0 0 0-2.3Z"/>
  <circle cx="8" cy="11.5" r="1.15" fill="#2e3436"/>
</svg>
