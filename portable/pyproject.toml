[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sessionsifu-portable"
version = "2.3.1"
description = "Cross-platform desktop session snapshots for Windows, macOS, KDE and GNOME"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{name = "SessionSifu contributors"}]
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
gui = [
  "PySide6>=6.8",
  "dbus-next>=0.2.3; sys_platform == 'linux'",
  "pyobjc-framework-Cocoa>=11; sys_platform == 'darwin'",
]
build = ["PyInstaller>=6.12", "Pillow>=11"]

[project.scripts]
sessionsifu-portable = "sessionsifu_portable.__main__:main"

[tool.setuptools]
packages = ["sessionsifu_portable", "sessionsifu_portable.adapters"]
