[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sessionsifu-portable"
version = "2.5.2"
description = "Cross-platform desktop session snapshots for Windows, macOS, KDE and GNOME"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{name = "SessionSifu contributors"}]
dependencies = ["psutil==7.2.2"]

[project.optional-dependencies]
gui = [
  "PySide6==6.11.2",
  "dbus-next==0.2.3; sys_platform == 'linux'",
  "pyobjc-framework-Cocoa==12.2.2; sys_platform == 'darwin'",
]
build = ["PyInstaller==6.22.2", "Pillow==12.3.0"]

[project.scripts]
sessionsifu-portable = "sessionsifu_portable.__main__:main"

[tool.setuptools]
packages = ["sessionsifu_portable", "sessionsifu_portable.adapters"]
